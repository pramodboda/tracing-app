<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tracer — AR Drawing Aid</title>
<style>
  :root{
    --bg:#0B0D10;
    --panel:rgba(18,20,24,0.74);
    --panel-solid:#14161B;
    --line:rgba(242,239,233,0.14);
    --ink:#F2EFE9;
    --ink-dim:#9A9A96;
    --accent:#E8A33D;
    --accent-dim:rgba(232,163,61,0.28);
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    overscroll-behavior:none;
    position:fixed; inset:0;
  }
  #stage{
    position:fixed; inset:0; overflow:hidden; touch-action:none;
  }
  video#cam{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000;
  }
  #overlayWrap{
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none;
  }
  img#overlayImg{
    position:absolute; top:50%; left:50%; max-width:none; max-height:none;
    transform-origin:center center;
    will-change:transform;
    pointer-events:none;
    filter:none;
  }
  #gestureCatcher{
    position:absolute; inset:0; touch-action:none;
  }

  /* viewfinder brackets — signature element */
  .bracket{
    position:absolute; width:34px; height:34px; border-color:var(--accent);
    border-style:solid; opacity:0.85; pointer-events:none; z-index:5;
    filter:drop-shadow(0 0 6px rgba(232,163,61,0.35));
  }
  .bracket.tl{top:14px; left:14px; border-width:2.5px 0 0 2.5px; border-top-left-radius:6px;}
  .bracket.tr{top:14px; right:14px; border-width:2.5px 2.5px 0 0; border-top-right-radius:6px;}
  .bracket.bl{bottom:14px; left:14px; border-width:0 0 2.5px 2.5px; border-bottom-left-radius:6px;}
  .bracket.br{bottom:14px; right:14px; border-width:0 2.5px 2.5px 0; border-bottom-right-radius:6px;}

  #grid{
    position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s;
    background-image:
      linear-gradient(to right, rgba(232,163,61,0.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(232,163,61,0.35) 1px, transparent 1px);
    background-size: 12.5% 12.5%;
  }
  #grid.on{opacity:1;}

  #emptyState{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:4; text-align:center; padding:24px;
  }
  #emptyState.hidden{display:none;}
  #emptyState .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--accent); text-transform:uppercase;
  }
  #emptyState h1{font-size:22px; font-weight:600; margin:0; color:var(--ink);}
  #emptyState p{font-size:13.5px; color:var(--ink-dim); max-width:280px; margin:0; line-height:1.5;}
  #loadBtn{
    margin-top:6px; padding:12px 22px; border-radius:10px; border:1px solid var(--accent);
    background:var(--accent-dim); color:var(--accent); font-size:14px; font-weight:600;
    font-family:var(--sans); cursor:pointer;
  }

  /* top status bar */
  #statusBar{
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px 0 16px; pointer-events:none;
  }
  #statusBar .tag{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; color:var(--ink-dim);
    background:var(--panel); backdrop-filter:blur(10px); padding:5px 9px; border-radius:6px;
    border:1px solid var(--line); pointer-events:auto;
  }
  #statusBar .tag b{color:var(--accent); font-weight:600;}

  /* bottom control dock */
  #dock{
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    background:var(--panel); backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:10px 12px calc(12px + env(safe-area-inset-bottom)) 12px;
  }
  #dockHandle{
    width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 10px auto;
  }
  .row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  .row label{
    font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-dim); width:56px; flex-shrink:0;
  }
  .row .val{
    font-family:var(--mono); font-size:11px; color:var(--accent); width:38px; text-align:right; flex-shrink:0;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:28px; background:transparent; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px; background:var(--line); border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; margin-top:-7.5px;
    border-radius:50%; background:var(--accent); border:2px solid var(--panel-solid);
    box-shadow:0 0 0 1px var(--accent);
  }
  input[type=range]::-moz-range-track{height:3px; background:var(--line); border-radius:2px;}
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; background:var(--accent); border:2px solid var(--panel-solid);
  }

  #iconRow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
  .ibtn{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:transparent; border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:8px 10px; cursor:pointer; font-family:var(--sans);
    min-width:58px;
  }
  .ibtn.active{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
  .ibtn svg{width:18px; height:18px; stroke:currentColor;}
  .ibtn span{font-size:9px; letter-spacing:0.03em; font-family:var(--mono); text-transform:uppercase;}
  .ibtn#btnLock.locked{border-color:#5CC28B; color:#5CC28B; background:rgba(92,194,139,0.16);}
  .ibtn:disabled{opacity:0.32; pointer-events:none;}

  #lockTag{
    display:none; font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; color:#5CC28B;
    background:var(--panel); backdrop-filter:blur(10px); padding:5px 9px; border-radius:6px;
    border:1px solid rgba(92,194,139,0.4); pointer-events:none;
  }
  #lockTag.on{display:block;}

  input[type=range]:disabled{opacity:0.35;}
  input[type=range]:disabled::-webkit-slider-thumb{background:var(--ink-dim); box-shadow:0 0 0 1px var(--ink-dim);}

  #blendSelect{
    font-family:var(--mono); font-size:11px; background:var(--panel-solid); color:var(--ink);
    border:1px solid var(--line); border-radius:7px; padding:6px 8px; flex:1;
  }

  #collapseBtn{
    position:absolute; bottom:0; right:14px; transform:translateY(-100%);
    background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--line); border-bottom:none;
    border-radius:10px 10px 0 0; padding:6px 12px; color:var(--ink-dim); font-size:11px;
    font-family:var(--mono); z-index:6; cursor:pointer;
  }
  #dock.collapsed{transform:translateY(100%);}
  #dock{transition:transform .25s ease;}

  input[type=file]{display:none;}
</style>
</head>
<body>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="grid"></div>
  <div id="overlayWrap">
    <img id="overlayImg" alt="">
  </div>
  <div id="gestureCatcher"></div>

  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div id="statusBar">
    <div class="tag">TRACER <b>·</b> LIVE</div>
    <div class="tag" id="camTag">CAM: —</div>
  </div>
  <div id="lockTag" style="position:absolute; top:44px; right:16px; z-index:6;">🔒 LOCKED</div>

  <div id="emptyState">
    <div class="eyebrow">Step 1</div>
    <h1>Load a reference image</h1>
    <p>Point this device's camera down at your paper or canvas, then load the artwork you want to trace.</p>
    <button id="loadBtn">Choose Image</button>
  </div>
</div>

<button id="collapseBtn">▲ Controls</button>
<div id="dock">
  <div id="dockHandle"></div>

  <div class="row">
    <label>Opacity</label>
    <input type="range" id="opacitySlider" min="5" max="100" value="55">
    <div class="val" id="opacityVal">55%</div>
  </div>
  <div class="row">
    <label>Scale</label>
    <input type="range" id="scaleSlider" min="10" max="400" value="100">
    <div class="val" id="scaleVal">100%</div>
  </div>
  <div class="row">
    <label>Rotate</label>
    <input type="range" id="rotateSlider" min="-180" max="180" value="0">
    <div class="val" id="rotateVal">0°</div>
  </div>
  <div class="row">
    <label>Blend</label>
    <select id="blendSelect">
      <option value="normal">Normal</option>
      <option value="difference">Difference (align edges)</option>
      <option value="multiply">Multiply</option>
      <option value="screen">Screen</option>
      <option value="luminosity">Luminosity</option>
    </select>
  </div>

  <div id="iconRow">
    <button class="ibtn" id="btnLock">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <span id="lockLabel">Lock</span>
    </button>
    <button class="ibtn" id="btnLoad">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 16l4.5-6 3.5 4 3-3L20 16"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
      <span>Image</span>
    </button>
    <button class="ibtn" id="btnFlipH">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 3v18M7 7l-3 5 3 5M17 7l3 5-3 5"/></svg>
      <span>Flip H</span>
    </button>
    <button class="ibtn" id="btnFlipV">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 12h18M7 7l5-3 5 3M7 17l5 3 5-3"/></svg>
      <span>Flip V</span>
    </button>
    <button class="ibtn" id="btnGrid">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      <span>Grid</span>
    </button>
    <button class="ibtn" id="btnCamSwitch">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M17 2l4 4-4 4M3 12a9 9 0 0115-6.7M7 22l-4-4 4-4M21 12a9 9 0 01-15 6.7"/></svg>
      <span>Switch</span>
    </button>
    <button class="ibtn" id="btnReset">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      <span>Reset</span>
    </button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*">

<script>
(function(){
  const cam = document.getElementById('cam');
  const overlayImg = document.getElementById('overlayImg');
  const gestureCatcher = document.getElementById('gestureCatcher');
  const fileInput = document.getElementById('fileInput');
  const emptyState = document.getElementById('emptyState');
  const camTag = document.getElementById('camTag');
  const grid = document.getElementById('grid');
  const dock = document.getElementById('dock');
  const collapseBtn = document.getElementById('collapseBtn');
  const btnLock = document.getElementById('btnLock');
  const lockLabel = document.getElementById('lockLabel');
  const lockTag = document.getElementById('lockTag');

  const opacitySlider = document.getElementById('opacitySlider');
  const scaleSlider = document.getElementById('scaleSlider');
  const rotateSlider = document.getElementById('rotateSlider');
  const opacityVal = document.getElementById('opacityVal');
  const scaleVal = document.getElementById('scaleVal');
  const rotateVal = document.getElementById('rotateVal');
  const blendSelect = document.getElementById('blendSelect');

  const STORAGE_KEY = 'tracer_state_v1';
  let state = {
    x: 0, y: 0, scale: 1, rotate: 0, opacity: 0.55,
    flipH: false, flipV: false, blend: 'normal', imgData: null,
    facing: 'environment', locked: false
  };

  // ---------- persistence ----------
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ Object.assign(state, JSON.parse(raw)); }
    }catch(e){}
  }

  // ---------- overlay transform ----------
  function applyTransform(){
    const sx = state.flipH ? -1 : 1;
    const sy = state.flipV ? -1 : 1;
    overlayImg.style.transform =
      `translate(-50%, -50%) translate(${state.x}px, ${state.y}px) rotate(${state.rotate}deg) scale(${state.scale * sx}, ${state.scale * sy})`;
    overlayImg.style.opacity = state.opacity;
    overlayImg.style.mixBlendMode = state.blend;
  }

  function applyLockUI(){
    btnLock.classList.toggle('locked', state.locked);
    lockLabel.textContent = state.locked ? 'Unlock' : 'Lock';
    lockTag.classList.toggle('on', state.locked);
    scaleSlider.disabled = state.locked;
    rotateSlider.disabled = state.locked;
    document.getElementById('btnFlipH').disabled = state.locked;
    document.getElementById('btnFlipV').disabled = state.locked;
    document.getElementById('btnReset').disabled = state.locked;
    gestureCatcher.style.touchAction = state.locked ? 'none' : 'none';
    gestureCatcher.style.pointerEvents = state.locked ? 'none' : 'auto';
  }

  function syncControlsFromState(){
    opacitySlider.value = Math.round(state.opacity * 100);
    opacityVal.textContent = Math.round(state.opacity*100) + '%';
    scaleSlider.value = Math.round(state.scale * 100);
    scaleVal.textContent = Math.round(state.scale*100) + '%';
    rotateSlider.value = Math.round(state.rotate);
    rotateVal.textContent = Math.round(state.rotate) + '°';
    blendSelect.value = state.blend;
  }

  // ---------- image loading ----------
  function setImage(dataUrl){
    overlayImg.src = dataUrl;
    state.imgData = dataUrl;
    emptyState.classList.add('hidden');
    save();
  }
  overlayImg.addEventListener('load', ()=>{
    // set intrinsic size once so scale=1 means natural size, capped to reasonable viewport size
    const maxDim = Math.max(window.innerWidth, window.innerHeight) * 1.2;
    let w = overlayImg.naturalWidth, h = overlayImg.naturalHeight;
    const ratio = Math.min(1, maxDim / Math.max(w,h));
    overlayImg.style.width = (w*ratio) + 'px';
    overlayImg.style.height = (h*ratio) + 'px';
    applyTransform();
  });

  function handleFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=> setImage(e.target.result);
    reader.readAsDataURL(file);
  }
  fileInput.addEventListener('change', (e)=> handleFile(e.target.files[0]));
  document.getElementById('loadBtn').addEventListener('click', ()=> fileInput.click());
  document.getElementById('btnLoad').addEventListener('click', ()=> fileInput.click());

  // ---------- controls ----------
  opacitySlider.addEventListener('input', ()=>{
    state.opacity = opacitySlider.value/100;
    opacityVal.textContent = opacitySlider.value + '%';
    applyTransform(); save();
  });
  scaleSlider.addEventListener('input', ()=>{
    state.scale = scaleSlider.value/100;
    scaleVal.textContent = scaleSlider.value + '%';
    applyTransform(); save();
  });
  rotateSlider.addEventListener('input', ()=>{
    state.rotate = parseFloat(rotateSlider.value);
    rotateVal.textContent = rotateSlider.value + '°';
    applyTransform(); save();
  });
  blendSelect.addEventListener('change', ()=>{
    state.blend = blendSelect.value;
    applyTransform(); save();
  });
  document.getElementById('btnFlipH').addEventListener('click', ()=>{
    state.flipH = !state.flipH; applyTransform(); save();
    document.getElementById('btnFlipH').classList.toggle('active', state.flipH);
  });
  document.getElementById('btnFlipV').addEventListener('click', ()=>{
    state.flipV = !state.flipV; applyTransform(); save();
    document.getElementById('btnFlipV').classList.toggle('active', state.flipV);
  });
  document.getElementById('btnGrid').addEventListener('click', (e)=>{
    grid.classList.toggle('on');
    e.currentTarget.classList.toggle('active', grid.classList.contains('on'));
  });
  btnLock.addEventListener('click', ()=>{
    state.locked = !state.locked;
    applyLockUI();
    save();
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    state.x=0; state.y=0; state.scale=1; state.rotate=0;
    syncControlsFromState(); applyTransform(); save();
  });
  collapseBtn.addEventListener('click', ()=>{
    dock.classList.toggle('collapsed');
    collapseBtn.textContent = dock.classList.contains('collapsed') ? '▼ Controls' : '▲ Controls';
  });

  // ---------- gestures: drag to move, pinch to scale+rotate ----------
  let pointers = new Map();
  let gestureStart = null;

  function getPointsArray(){
    return Array.from(pointers.values());
  }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function angle(a,b){ return Math.atan2(b.y-a.y, b.x-a.x) * 180/Math.PI; }

  gestureCatcher.addEventListener('pointerdown', (e)=>{
    gestureCatcher.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const pts = getPointsArray();
    if(pts.length === 1){
      gestureStart = { type:'drag', startX: pts[0].x, startY: pts[0].y, origX: state.x, origY: state.y };
    } else if(pts.length === 2){
      gestureStart = {
        type:'pinch',
        startDist: dist(pts[0], pts[1]),
        startAngle: angle(pts[0], pts[1]),
        origScale: state.scale,
        origRotate: state.rotate
      };
    }
  });

  gestureCatcher.addEventListener('pointermove', (e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const pts = getPointsArray();
    if(!gestureStart) return;

    if(gestureStart.type === 'drag' && pts.length === 1){
      state.x = gestureStart.origX + (pts[0].x - gestureStart.startX);
      state.y = gestureStart.origY + (pts[0].y - gestureStart.startY);
      applyTransform();
    } else if(gestureStart.type === 'pinch' && pts.length === 2){
      const d = dist(pts[0], pts[1]);
      const a = angle(pts[0], pts[1]);
      const scaleFactor = d / gestureStart.startDist;
      state.scale = Math.max(0.05, gestureStart.origScale * scaleFactor);
      state.rotate = gestureStart.origRotate + (a - gestureStart.startAngle);
      syncControlsFromState();
      applyTransform();
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    const pts = getPointsArray();
    if(pts.length === 1){
      gestureStart = { type:'drag', startX: pts[0].x, startY: pts[0].y, origX: state.x, origY: state.y };
    } else if(pts.length === 0){
      gestureStart = null;
      syncControlsFromState();
      save();
    }
  }
  gestureCatcher.addEventListener('pointerup', endPointer);
  gestureCatcher.addEventListener('pointercancel', endPointer);
  gestureCatcher.addEventListener('pointerleave', endPointer);

  // ---------- camera ----------
  let currentStream = null;
  async function startCamera(facing){
    if(currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width:{ideal:1920}, height:{ideal:1080} },
        audio:false
      });
      currentStream = stream;
      cam.srcObject = stream;
      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings ? track.getSettings() : {};
      camTag.textContent = 'CAM: ' + (settings.facingMode || facing || 'default').toUpperCase();
      state.facing = facing;
      save();
    }catch(err){
      camTag.textContent = 'CAM: ERROR';
      console.error(err);
      alert('Could not access camera: ' + err.message + '\n\nMake sure this page is loaded over HTTPS and camera permission is allowed.');
    }
  }
  document.getElementById('btnCamSwitch').addEventListener('click', ()=>{
    const next = state.facing === 'environment' ? 'user' : 'environment';
    startCamera(next);
  });

  // ---------- init ----------
  load();
  syncControlsFromState();
  applyLockUI();
  document.getElementById('btnFlipH').classList.toggle('active', state.flipH);
  document.getElementById('btnFlipV').classList.toggle('active', state.flipV);
  if(state.imgData){
    overlayImg.src = state.imgData;
    emptyState.classList.add('hidden');
  }
  startCamera(state.facing || 'environment');

  // prevent page scroll/bounce
  document.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
})();
</script>
</body>
</html>
