<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tracer — Camera Source</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0B0D10; --panel:rgba(18,20,24,0.82); --line:rgba(242,239,233,0.14);
    --ink:#F2EFE9; --ink-dim:#9A9A96; --accent:#E8A33D; --accent-dim:rgba(232,163,61,0.28);
    --green:#5CC28B; --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--sans); overflow:hidden; position:fixed; inset:0;}
  video#cam{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000;}

  #topCard{
    position:absolute; top:0; left:0; right:0; z-index:5;
    padding:16px 16px 0 16px;
  }
  #codeCard{
    background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line);
    border-radius:14px; padding:16px; text-align:center;
  }
  #codeCard .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.14em; color:var(--ink-dim);
    text-transform:uppercase; margin-bottom:8px;
  }
  #codeVal{
    font-family:var(--mono); font-size:34px; font-weight:600; letter-spacing:0.06em; color:var(--accent);
    line-height:1.1;
  }
  #codeVal.pending{font-size:15px; color:var(--ink-dim); letter-spacing:normal;}
  #statusRow{
    display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px;
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
  }
  #statusDot{width:8px; height:8px; border-radius:50%; background:var(--ink-dim);}
  #statusDot.connected{background:var(--green); box-shadow:0 0 8px var(--green);}
  #statusDot.error{background:#e05c5c;}

  #bottomHint{
    position:absolute; bottom:0; left:0; right:0; z-index:5;
    padding:0 16px calc(16px + env(safe-area-inset-bottom)) 16px;
  }
  #hintCard{
    background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font-size:12.5px; color:var(--ink-dim); line-height:1.5;
  }
  #hintCard b{color:var(--ink);}
</style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>

  <div id="topCard">
    <div id="codeCard">
      <div class="eyebrow">Connection Code</div>
      <div id="codeVal" class="pending">Starting camera…</div>
      <div id="statusRow"><div id="statusDot"></div><span id="statusText">Waiting for camera</span></div>
    </div>
  </div>

  <div id="bottomHint">
    <div id="hintCard">
      Place this phone <b>face-down over your art surface</b>. On your iPad, open the viewer page and enter the code above to connect.
    </div>
  </div>

<script>
(function(){
  const codeVal = document.getElementById('codeVal');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const cam = document.getElementById('cam');

  let peer = null;
  let localStream = null;

  async function startCamera(){
    try{
      localStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
        audio:false
      });
      cam.srcObject = localStream;
      startPeer();
    }catch(err){
      codeVal.textContent = 'Camera error';
      codeVal.classList.add('pending');
      statusText.textContent = err.message;
      statusDot.classList.add('error');
    }
  }

  function startPeer(){
    // short, easy-to-type room code
    const code = Math.random().toString(36).substring(2,7).toUpperCase();
    peer = new Peer('tracer-' + code, {
      config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]}
    });

    peer.on('open', ()=>{
      codeVal.textContent = code;
      codeVal.classList.remove('pending');
      statusText.textContent = 'Ready — waiting for iPad';
    });

    peer.on('call', (call)=>{
      call.answer(localStream);
      statusText.textContent = 'Connected to iPad';
      statusDot.classList.add('connected');
      call.on('close', ()=>{
        statusText.textContent = 'iPad disconnected';
        statusDot.classList.remove('connected');
      });
    });

    peer.on('error', (err)=>{
      statusText.textContent = 'Connection error: ' + err.type;
      statusDot.classList.add('error');
    });

    peer.on('disconnected', ()=>{
      statusText.textContent = 'Reconnecting…';
      statusDot.classList.remove('connected');
      peer.reconnect();
    });
  }

  startCamera();
  document.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
})();
</script>
</body>
</html>
